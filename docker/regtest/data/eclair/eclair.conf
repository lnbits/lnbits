eclair {
  chain = "regtest"

  # Allow margin for CLN's ~100 sat/vB estimates above the 10 sat/vB anchor cap.
  on-chain-fees.feerate-tolerance.ratio-high = 20.0

  api {
    binding-ip = "0.0.0.0"
    enabled = true
    port = 8080
    password = "lnbits"
  }

  bitcoind {
    host = "bitcoind"
    rpcport = 18443
    auth = "safecookie"
    cookie = "/root/.bitcoin/regtest/.cookie"

    zmqblock = "tcp://bitcoind:29002"
    zmqtx = "tcp://bitcoind:29000"
  }

  channel {
    max-funding-satoshis = 10000000000
  }

  features {
    option_support_large_channel = mandatory
  }
}
