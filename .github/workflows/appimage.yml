name: Build LNbits AppImage

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'The tag name for the release'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag name for the release'
        required: true
        type: string

jobs:
  build-linux-package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install system deps and uv
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Cache uv and venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml') }}

      - name: Verify frontend assets
        run: |
          npm ci
          npm run bundle
          git diff --exit-code -- lnbits/static
        shell: bash

      - name: Build LNbits binary (uv + PyInstaller)
        run: |
          uv sync --locked --all-extras --no-dev --no-editable
          uv pip install pyinstaller
          export DEBUG=false
          WASMTIME_LIB="$(.venv/bin/python -c \
            'from pathlib import Path; import wasmtime; print(next(Path(wasmtime.__file__).parent.glob("linux-*/*.so")))')"
          WASMTIME_PLATFORM="$(basename "$(dirname "$WASMTIME_LIB")")"
          .venv/bin/pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name lnbits \
            --specpath build \
            --hidden-import=embit \
            --hidden-import=bitstring.bitstore_bitarray \
            --add-binary "$WASMTIME_LIB:wasmtime/$WASMTIME_PLATFORM" \
            --collect-all embit \
            --collect-all bitstring \
            --collect-all bitarray \
            --collect-all coincurve \
            --collect-all wasmtime \
            --collect-all lnbits \
            --collect-all sqlalchemy \
            --collect-all breez_sdk \
            --collect-binaries breez_sdk \
            --collect-all breez_sdk_liquid \
            --collect-binaries breez_sdk_liquid \
            --collect-all aiosqlite \
            .venv/bin/lnbits
        shell: bash

      - name: Stage AppDir
        run: |
          mkdir -p packaging/linux
          cp -a .github/packaging/linux/AppDir packaging/linux/AppDir
          mkdir -p packaging/linux/AppDir/usr/lnbits
          git archive HEAD | tar -x -C packaging/linux/AppDir/usr/lnbits
          mkdir -p packaging/linux/AppDir/usr/lnbits/dist
          install -m 755 dist/lnbits packaging/linux/AppDir/usr/lnbits/dist/lnbits
          chmod +x packaging/linux/AppDir/AppRun
          chmod +x packaging/linux/AppDir/lnbits.desktop

          # keep AppDir slim
          find packaging/linux/AppDir/usr/lnbits -mindepth 1 -maxdepth 1 \
              ! -name 'dist' \
              ! -name 'lnbits' \
              -exec rm -rf {} +
        shell: bash

      - name: Smoke test packaged binary and assets
        run: |
          SMOKE_DIR="$(mktemp -d)"
          PACKAGE_DIR="$GITHUB_WORKSPACE/packaging/linux/AppDir/usr/lnbits"
          export DEBUG=false
          export BUNDLE_ASSETS=true
          export LNBITS_DATA_FOLDER="$SMOKE_DIR/data"
          export LNBITS_EXTENSIONS_PATH="$SMOKE_DIR"
          export LNBITS_EXTENSIONS_DEFAULT_INSTALL='[]'
          export LNBITS_ADMIN_UI=false
          export LNBITS_BACKEND_WALLET_CLASS=FakeWallet
          cd "$PACKAGE_DIR"
          setsid ./dist/lnbits --host 127.0.0.1 --port 5001 &
          LNBITS_PID=$!
          trap 'kill -- -"$LNBITS_PID" 2>/dev/null || true; rm -rf "$SMOKE_DIR"' EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5001/ | grep -q '<title>LNbits</title>'; then
              exit 0
            fi
            if ! kill -0 "$LNBITS_PID" 2>/dev/null; then
              echo "Packaged LNbits exited before serving the homepage." >&2
              exit 1
            fi
            sleep 1
          done

          echo "Packaged LNbits did not serve the homepage within 60 seconds." >&2
          exit 1
        shell: bash

      - name: Build AppImage
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          TAG_NAME=${{ inputs.tag_name }}
          APPIMAGE_NAME="LNbits-${TAG_NAME}.AppImage"
          ./appimagetool-x86_64.AppImage \
            --updateinformation "gh-releases-zsync|lnbits|lnbits|latest|*.AppImage.zsync" \
            packaging/linux/AppDir "$APPIMAGE_NAME"
          chmod +x "$APPIMAGE_NAME"
          echo "APPIMAGE_NAME=$APPIMAGE_NAME" >> $GITHUB_ENV

          # 🔎 quick audit: show glibc versions referenced by the binary
          echo "Runner glibc:"
          ldd --version | head -n1 || true
          echo "Symbols needed by lnbits:"
          strings "$APPIMAGE_NAME" | grep -o 'GLIBC_[0-9.]*' | sort -u || true
        shell: bash

      - name: Upload Linux Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" "${{ env.APPIMAGE_NAME }}" --clobber
