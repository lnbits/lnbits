name: bundle
on:
  workflow_call:

jobs:
  bundle:
    if: >-
      github.event.head_commit.message != 'chore: make bundle'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: lnbits/lnbits/.github/actions/prepare@dev
        with:
          python-version: "3.10"
          node-version: "24.x"
          npm: true
      - run: make bundle
      - name: Commit and push bundle changes
        run: |
          git config user.name "alan"
          git config user.email "alan@lnbits.com"
          git add lnbits/static
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: make bundle"
          git push
