name: docker

on:
  workflow_dispatch:
    inputs:
      tag:
        default: latest
        type: string
  workflow_call:
    inputs:
      tag:
        default: latest
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  push_to_dockerhub:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
            context: .
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/lnbits:${{ inputs.tag }}
            platforms: linux/amd64,linux/arm64
            cache-from: type=gha,scope=lnbits
            cache-to: type=gha,mode=max,scope=lnbits

      - name: Build and push boltz
        uses: docker/build-push-action@v5
        with:
            context: docker/boltzclient
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/lnbits-boltz:${{ inputs.tag }}
            platforms: linux/amd64,linux/arm64
            cache-from: type=gha,scope=lnbits-boltz
            cache-to: type=gha,mode=max,scope=lnbits-boltz
            build-args: LNBITS_TAG=${{ inputs.tag }}

      - name: Build and push sparkl2
        uses: docker/build-push-action@v5
        with:
            context: docker/sparkl2
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/lnbits-sparkl2:${{ inputs.tag }}
            platforms: linux/amd64,linux/arm64
            cache-from: type=gha,scope=lnbits-sparkl2
            cache-to: type=gha,mode=max,scope=lnbits-sparkl2
            build-args: LNBITS_TAG=${{ inputs.tag }}
