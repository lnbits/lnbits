name: LNbits CI
on:
  pull_request:


jobs:
  # Temporarily run only regtest while reproducing #4240.
  lint:
    if: ${{ false }}
    uses: ./.github/workflows/lint.yml

  test-api:
    if: ${{ false }}
    needs: [ lint ]
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        db-url: ["", "postgres://lnbits:lnbits@0.0.0.0:5432/lnbits"]
    uses: ./.github/workflows/tests.yml
    with:
      custom-pytest: "uv run pytest tests/api"
      python-version: ${{ matrix.python-version }}
      db-url: ${{ matrix.db-url }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-wallets:
    if: ${{ false }}
    needs: [ lint ]
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        db-url: ["", "postgres://lnbits:lnbits@0.0.0.0:5432/lnbits"]
    uses: ./.github/workflows/tests.yml
    with:
      custom-pytest: "uv run pytest tests/wallets"
      python-version: ${{ matrix.python-version }}
      db-url: ${{ matrix.db-url }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-unit:
    if: ${{ false }}
    needs: [ lint ]
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        db-url: ["", "postgres://lnbits:lnbits@0.0.0.0:5432/lnbits"]
    uses: ./.github/workflows/tests.yml
    with:
      custom-pytest: "uv run pytest tests/unit"
      python-version: ${{ matrix.python-version }}
      db-url: ${{ matrix.db-url }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  migration:
    if: ${{ false }}
    needs: [ lint ]
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    uses: ./.github/workflows/migration.yml
    with:
      python-version: ${{ matrix.python-version }}

  openapi:
    if: ${{ false }}
    needs: [ lint ]
    uses: ./.github/workflows/make.yml
    with:
      make: openapi

  test-e2e:
    if: ${{ false }}
    needs: [ lint ]
    uses: ./.github/workflows/e2e.yml

  regtest:
    uses: ./.github/workflows/regtest.yml
    strategy:
      matrix:
        python-version: ["3.12"]
        backend-wallet-class:
          # Temporarily skip Boltz while its regtest backend is failing.
          # - BoltzWallet
          - LndRestWallet
          - LndWallet
          - CoreLightningWallet
          - CoreLightningRestWallet
          - LNbitsWallet
          - EclairWallet
    with:
      custom-pytest: "uv run pytest tests/regtest"
      python-version: ${{ matrix.python-version }}
      backend-wallet-class: ${{ matrix.backend-wallet-class }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  jmeter:
    if: ${{ false }}
    needs: [ lint ]
    strategy:
      matrix:
        python-version: ["3.12"]
    uses: ./.github/workflows/jmeter.yml
    with:
      python-version: ${{ matrix.python-version }}

  bundle:
    if: ${{ false }}
    needs: [ lint, test-api, test-wallets, test-unit, migration, openapi, regtest, jmeter ]
    uses: ./.github/workflows/bundle.yml
